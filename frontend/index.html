<!DOCTYPE html>
<html>
<head>
  <title>Travel Guide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HERO SLIDER -->
<div class="hero hero-slider" id="hero">
  <div class="hero-overlay">
    <h1>Explore the World 🌍</h1>
    <p>Your journey starts here</p>

    <!-- ONLY ONE CTA -->
    <a href="booking.html" class="btn primary">Book Now</a>
  </div>

</div>

<!-- DESTINATIONS -->
<section class="home-section">
  <h2 class="section-title">Popular Destinations</h2>

  <div class="destinations">
    <div class="destination-card">
      <img src="images/kerala.jpg">
      <div class="card-content">
        <h3>Kerala</h3>
        <p>Backwaters & greenery</p>
        <a href="place.html?place=kerala" class="btn primary">Explore</a>
      </div>
    </div>

    <div class="destination-card">
      <img src="images/goa.jpg">
      <div class="card-content">
        <h3>Goa</h3>
        <p>Beaches & nightlife</p>
        <a href="place.html?place=goa" class="btn primary">Explore</a>
      </div>
    </div>

    <div class="destination-card">
      <img src="images/manali.jpg">
      <div class="card-content">
        <h3>Manali</h3>
        <p>Snow & adventure</p>
        <a href="place.html?place=manali" class="btn primary">Explore</a>
      </div>
    </div>

    <div class="destination-card">
      <img src="images/rajasthan.jpg">
      <div class="card-content">
        <h3>Rajasthan</h3>
        <p>Royal heritage & deserts</p>
        <a href="place.html?place=rajasthan" class="btn primary">Explore</a>
      </div>
    </div>
  </div>

<script src="js/hero-slider.js"></script>

</html>
